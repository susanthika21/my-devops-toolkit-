name: CI/CD Docker Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python & Run Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r ci-cd-local-deploy/requirements.txt
          python -m unittest discover -s ci-cd-local-deploy

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ci-cd-local-deploy
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:ci-cd-latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull image and deploy container locally
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:ci-cd-latest
          docker stop flask-cicd-demo || true
          docker rm flask-cicd-demo || true
          docker run -d --name flask-cicd-demo -p 8080:5000 --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:ci-cd-latest
          docker image prune -f
